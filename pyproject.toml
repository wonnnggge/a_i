[project]
name = "a-i"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "gradio>=6.30.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.1",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "openai>=3.29.0",
    "openai-agents>=0.24.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "pywin32>=312",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
]

[project.scripts]
a-i = "a_i:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
]
