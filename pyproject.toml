[project]
name = "a-i"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "gradio>=6.30.0",
    "matplotlib>=3.11.2",
    "openai>=3.29.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
]

[project.scripts]
a-i = "a_i:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
]
